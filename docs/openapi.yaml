openapi: 3.1.0
info:
  title: FastAPI Backend
  version: 0.1.0
paths:
  /api/auth/register:
    post:
      tags:
      - auth
      summary: Create a new user
      description: Register a new user by providing an email and password.
      operationId: register_api_auth_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPublic'
        '400':
          description: Bad Request
          detail: Email already exists in the database
        '422':
          description: Unprocessable Entity
          detail: Incorrect email format
  /api/auth/login:
    post:
      tags:
      - auth
      summary: Get access token
      description: 'Standard OAuth2 password flow login.

        Returns a JWT token and user info.'
      operationId: login_api_auth_login_post
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Body_login_api_auth_login_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPublic'
        '400':
          description: Bad Request
          detail: Invalid credentials
        '403':
          description: Forbidden
          detail: User is inactive
        '500':
          description: Internal Server Error
          detail: Token generation failed
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/user/logout:
    get:
      tags:
      - Users
      summary: Log out current user
      description: 'Logs the user out by invalidating the current session. Note: Since
        JWT is stateless, the client should also delete the token locally.'
      operationId: logout_api_user_logout_get
      responses:
        '200':
          description: Successful logout message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                detail: Successfully logged out.
        '401':
          description: Unauthorized - Invalid or missing token.
      security:
      - OAuth2PasswordBearer: []
  /api/user/me:
    get:
      tags:
      - Users
      summary: Get current user profile
      description: Retrieves the full profile details of the currently authenticated
        user based on the provided Bearer token.
      operationId: read_users_me_api_user_me_get
      responses:
        '200':
          description: User profile retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPublic'
        '401':
          description: Unauthorized - Token is invalid or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
      security:
      - OAuth2PasswordBearer: []
  /api/prescriptions/create:
    post:
      tags:
      - prescription
      summary: Create and process a new prescription
      description: "Uploads a base64 encoded image of a prescription.\n\n    1. Saves\
        \ the image to the server.\n    2. Uses AI to extract medication names, dosages,\
        \ and doctor information.\n    3. Saves the extracted data to the database\
        \ linked to the current user."
      operationId: create_prescription_api_prescriptions_create_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrescriptionCreate'
        required: true
      responses:
        '201':
          description: Prescription successfully processed and saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrescriptionPublic'
        '401':
          description: Unauthorized - Valid token required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '500':
          description: Internal Server Error - AI extraction or database save failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /api/prescriptions/{prescription_id}:
    get:
      tags:
      - prescription
      summary: Get prescription by ID
      description: Retrieves the details of a specific prescription. The user must
        be the owner of the prescription.
      operationId: read_prescription_api_prescriptions__prescription_id__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: prescription_id
        in: path
        required: true
        schema:
          type: integer
          title: Prescription Id
      responses:
        '200':
          description: Prescription details retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrescriptionPublic'
        '403':
          description: Forbidden - You do not own this prescription.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '404':
          description: Prescription not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/prescriptions:
    get:
      tags:
