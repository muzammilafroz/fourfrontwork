components:
  schemas:
    AppointmentCreate:
      properties:
        appointment_date:
          format: date
          title: Appointment Date
          type: string
        appointment_time:
          format: time
          title: Appointment Time
          type: string
        doctor_id:
          title: Doctor Id
          type: integer
        patient_name:
          title: Patient Name
          type: string
        patient_phone:
          title: Patient Phone
          type: string
      required:
      - patient_name
      - patient_phone
      - doctor_id
      - appointment_date
      - appointment_time
      title: AppointmentCreate
      type: object
    AppointmentPublic:
      properties:
        appointment_date:
          format: date
          title: Appointment Date
          type: string
        appointment_time:
          format: time
          title: Appointment Time
          type: string
        created_at:
          format: date-time
          title: Created At
          type: string
        customer_id:
          title: Customer Id
          type: integer
        doctor:
          anyOf:
          - $ref: '#/components/schemas/DoctorPublic'
          - type: 'null'
        doctor_id:
          title: Doctor Id
          type: integer
        id:
          title: Id
          type: integer
        patient_name:
          title: Patient Name
          type: string
        patient_phone:
          title: Patient Phone
          type: string
        status:
          $ref: '#/components/schemas/AppointmentStatus'
          default: scheduled
        visit_fee:
          title: Visit Fee
          type: number
      required:
      - patient_name
      - patient_phone
      - appointment_date
      - appointment_time
      - visit_fee
      - id
      - doctor_id
      - customer_id
      title: AppointmentPublic
      type: object
    AppointmentStatus:
      enum:
      - scheduled
      - cancelled
      - completed
      title: AppointmentStatus
      type: string
    Body_login_api_auth_login_post:
      properties:
        client_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Client Id
        client_secret:
          anyOf:
          - type: string
          - type: 'null'
          format: password
          title: Client Secret
        grant_type:
          anyOf:
          - pattern: ^password$
            type: string
          - type: 'null'
          title: Grant Type
        password:
          format: password
          title: Password
          type: string
        scope:
          default: ''
          title: Scope
          type: string
        username:
          title: Username
          type: string
      required:
      - username
      - password
      title: Body_login_api_auth_login_post
      type: object
    CartItem:
      properties:
        id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Id
        medicine_id:
          title: Medicine Id
          type: integer
        order_id:
          title: Order Id
          type: integer
        price:
          title: Price
          type: number
        quantity:
          title: Quantity
          type: integer
      required:
      - quantity
      - price
      - order_id
      - medicine_id
      title: CartItem
      type: object
    DoctorPublic:
      properties:
        available_days:
          title: Available Days
          type: string
        available_time:
          title: Available Time
          type: string
        consultation_fee:
          title: Consultation Fee
          type: number
        id:
          title: Id
          type: integer
        name:
          title: Name
          type: string
        specialization:
          title: Specialization
          type: string
      required:
      - name
      - specialization
      - available_days
      - available_time
      - consultation_fee
      - id
      title: DoctorPublic
      type: object
    Feedback:
      properties:
        comment:
          title: Comment
          type: string
        created_at:
          format: date-time
          title: Created At
          type: string
        customer_id:
          title: Customer Id
          type: integer
        id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Id
        rating:
          maximum: 5.0
          minimum: 1.0
          title: Rating
          type: integer
      required:
      - rating
      - comment
      - customer_id
      title: Feedback
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    MedicationPublic:
      properties:
        dosage:
          title: Dosage
          type: string
        duration:
          anyOf:
          - type: string
          - type: 'null'
          title: Duration
        frequency:
          title: Frequency
          type: string
        id:
          title: Id
          type: integer
        name:
          title: Name
          type: string
      required:
      - name
      - dosage
      - frequency
      - id
      title: MedicationPublic
      type: object
    Medicine:
      properties:
        brand:
          title: Brand
          type: string
        composition:
          title: Composition
          type: string
        expiry_date:
          format: date
          title: Expiry Date
          type: string
        id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Id
        name:
          title: Name
          type: string
        price:
          title: Price
          type: number
        stock_quantity:
          title: Stock Quantity
          type: integer
      required:
      - name
      - composition
      - brand
      - price
      - stock_quantity
      - expiry_date
      title: Medicine
      type: object
    MedicineRequest:
      properties:
        composition:
          title: Composition
          type: string
        handled_by:
          anyOf:
          - type: integer
          - type: 'null'
          title: Handled By
        id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Id
        medicine_name:
          title: Medicine Name
          type: string
        requested_by:
          title: Requested By
          type: integer
        requested_date:
          format: date-time
          title: Requested Date
          type: string
        status:
          $ref: '#/components/schemas/RequestStatus'
          default: pending
      required:
      - medicine_name
      - composition
      - requested_by
      title: MedicineRequest
      type: object
    Message:
      properties:
        detail:
          title: Detail
          type: string
      required:
      - detail
      title: Message
      type: object
    Order:
      properties:
        customer_id:
          title: Customer Id
          type: integer
        customer_name:
          title: Customer Name
          type: string
        customer_phone:
          title: Customer Phone
          type: string
        employee_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Employee Id
        id:
          title: Id
          type: integer
        order_date:
          format: date-time
          title: Order Date
          type: string
        total_price:
          title: Total Price
          type: number
      required:
      - customer_name
      - customer_phone
      - total_price
      - customer_id
      title: Order
      type: object
    PrescriptionCreate:
      properties:
        image_base64:
          title: Image Base64
          type: string
      required:
      - image_base64
      title: PrescriptionCreate
      type: object
    PrescriptionPublic:
      properties:
        created_at:
          format: date-time
          title: Created At
          type: string
        customer_id:
          title: Customer Id
          type: integer
        date:
          anyOf:
          - type: string
          - type: 'null'
          title: Date
        diagnosis:
          anyOf:
          - type: string
          - type: 'null'
          title: Diagnosis
        doctor_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Doctor Name
        id:
          title: Id
          type: integer
        image_base64:
          anyOf:
          - type: string
          - type: 'null'
          title: Image Base64
        image_path:
          default: ''
          title: Image Path
          type: string
        medications:
          default: []
          items:
            $ref: '#/components/schemas/MedicationPublic'
          title: Medications
          type: array
        summary:
          anyOf:
          - type: string
          - type: 'null'
          title: Summary
      required:
      - id
      - customer_id
      - created_at
      title: PrescriptionPublic
      type: object
    RequestStatus:
      enum:
      - pending
      - approved
      - rejected
      - completed
      title: RequestStatus
      type: string
    TokenPublic:
      properties:
        access_token:
          title: Access Token
          type: string
        token_type:
          title: Token Type
          type: string
        user:
          $ref: '#/components/schemas/UserPublic'
      required:
      - access_token
      - token_type
      - user
      title: TokenPublic
      type: object
    User:
      properties:
        created_at:
          format: date-time
          title: Created At
          type: string
        email:
          title: Email
          type: string
        hashed_password:
          title: Hashed Password
          type: string
        id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Id
        name:
          title: Name
          type: string
        phone:
          title: Phone
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
          default: customer
        status:
          $ref: '#/components/schemas/UserStatus'
          default: active
      required:
      - name
      - email
      - phone
      - hashed_password
      title: User
      type: object
    UserCreate:
      properties:
        email:
          title: Email
          type: string
        name:
          title: Name
          type: string
        password:
          title: Password
          type: string
        phone:
          title: Phone
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
          default: customer
        status:
          $ref: '#/components/schemas/UserStatus'
          default: active
      required:
      - name
      - email
      - phone
      - password
      title: UserCreate
      type: object
    UserPublic:
      properties:
        email:
          title: Email
          type: string
        id:
          title: Id
          type: integer
        name:
          title: Name
          type: string
        phone:
          title: Phone
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
          default: customer
        status:
          $ref: '#/components/schemas/UserStatus'
          default: active
      required:
      - name
      - email
      - phone
      - id
      title: UserPublic
      type: object
    UserRole:
      enum:
      - admin
      - employee
      - customer
      title: UserRole
      type: string
    UserStatus:
      enum:
      - active
      - inactive
      - suspended
      title: UserStatus
      type: string
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
  securitySchemes:
    OAuth2PasswordBearer:
      flows:
        password:
          scopes: {}
          tokenUrl: auth/login
      type: oauth2
info:
  title: FastAPI Backend
  version: 0.1.0
openapi: 3.1.0
paths:
  /:
    get:
      operationId: root__get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Root
  /api/appointments:
    get:
      description: Retrieve a list of appointments belonging to the authenticated
        user. Includes an optional filter for specific doctors.
      operationId: read_appointments_api_appointments_get
      parameters:
      - in: query
        name: doctor_id
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Doctor Id
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AppointmentPublic'
                title: Response Read Appointments Api Appointments Get
                type: array
          description: List of appointments retrieved successfully.
        '401':
          description: Not authenticated.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: List my appointments
      tags:
      - appointments
    post:
      description: "Creates an appointment for the currently authenticated user.\n\
        \n    **Logic details:**\n    * The **Customer ID** is automatically assigned\
        \ from the logged-in user's session.\n    * The **Visit Fee** is automatically\
        \ retrieved from the Doctor's current consultation fee.\n    * Validates that\
        \ the specified Doctor exists before creation."
      operationId: create_appointment_api_appointments_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointmentCreate'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentPublic'
          description: Appointment successfully created.
        '401':
          description: Not authenticated.
        '404':
          description: Doctor not found.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Book a new appointment
      tags:
      - appointments
  /api/auth/login:
    post:
      description: 'Standard OAuth2 password flow login.

        Returns a JWT token and user info.'
      operationId: login_api_auth_login_post
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Body_login_api_auth_login_post'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPublic'
          description: Successful Response
        '400':
          description: Invalid credentials
        '403':
          description: User is inactive
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
        '500':
          description: Token generation failed
      summary: Get access token
      tags:
      - auth
  /api/auth/register:
    post:
      description: Register a new user by providing an email and password.
      operationId: register_api_auth_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPublic'
          description: Successful Response
        '400':
          description: Email already exists in the database
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Create a new user
      tags:
      - auth
  /api/cart:
    get:
      operationId: read_cart_items_api_cart_get
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/CartItem'
                title: Response Read Cart Items Api Cart Get
                type: array
          description: Successful Response
      security:
      - OAuth2PasswordBearer: []
      summary: Read Cart Items
      tags:
      - cart
    post:
      operationId: create_cart_item_api_cart_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartItem'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartItem'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Create Cart Item
      tags:
      - cart
  /api/cart/{cart_item_id}:
    delete:
      operationId: delete_cart_item_api_cart__cart_item_id__delete
      parameters:
      - in: path
        name: cart_item_id
        required: true
        schema:
          title: Cart Item Id
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Delete Cart Item
      tags:
      - cart
    get:
      operationId: read_cart_item_api_cart__cart_item_id__get
      parameters:
      - in: path
        name: cart_item_id
        required: true
        schema:
          title: Cart Item Id
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartItem'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Read Cart Item
      tags:
      - cart
    put:
      operationId: update_cart_item_api_cart__cart_item_id__put
      parameters:
      - in: path
        name: cart_item_id
        required: true
        schema:
          title: Cart Item Id
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartItem'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartItem'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Update Cart Item
      tags:
      - cart
  /api/customers:
    get:
      operationId: read_customers_api_customers_get
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/User'
                title: Response Read Customers Api Customers Get
                type: array
          description: Successful Response
      security:
      - OAuth2PasswordBearer: []
      summary: Read Customers
      tags:
      - customers
  /api/customers/{customer_id}:
    get:
      operationId: read_customer_api_customers__customer_id__get
      parameters:
      - in: path
        name: customer_id
        required: true
        schema:
          title: Customer Id
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Read Customer
      tags:
      - customers
    put:
      operationId: update_customer_api_customers__customer_id__put
      parameters:
      - in: path
        name: customer_id
        required: true
        schema:
          title: Customer Id
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Update Customer
      tags:
      - customers
  /api/doctors:
    get:
      description: Retrieve a list of doctors from the database. You can optionally
        filter the results by their medical specialization.
      operationId: read_doctors_api_doctors_get
      parameters:
      - description: Filter doctors by their medical specialty (e.g., 'Cardiology',
          'Pediatrics')
        in: query
        name: specialization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter doctors by their medical specialty (e.g., 'Cardiology',
            'Pediatrics')
          examples:
          - Cardiology
          - Neurology
          title: Specialization
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/DoctorPublic'
                title: Response Read Doctors Api Doctors Get
                type: array
          description: A list of doctor objects containing public profile information.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: List all doctors
      tags:
      - doctors
  /api/doctors/{doctor_id}:
    get:
      description: Fetch detailed information about a specific doctor using their
        unique integer ID.
      operationId: read_doctor_api_doctors__doctor_id__get
      parameters:
      - in: path
        name: doctor_id
        required: true
        schema:
          title: Doctor Id
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoctorPublic'
          description: Doctor found and returned.
        '404':
          description: No doctor exists with the provided ID.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get a doctor by ID
      tags:
      - doctors
  /api/feedback:
    get:
      operationId: read_feedback_api_feedback_get
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Feedback'
                title: Response Read Feedback Api Feedback Get
                type: array
          description: Successful Response
      security:
      - OAuth2PasswordBearer: []
      summary: Read Feedback
      tags:
      - feedback
    post:
      operationId: create_feedback_api_feedback_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Feedback'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Feedback'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Create Feedback
      tags:
      - feedback
  /api/feedback/{feedback_id}:
    get:
      operationId: read_feedback_item_api_feedback__feedback_id__get
      parameters:
      - in: path
        name: feedback_id
        required: true
        schema:
          title: Feedback Id
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Feedback'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Read Feedback Item
      tags:
      - feedback
  /api/inventory:
    get:
      operationId: read_inventory_api_inventory_get
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Medicine'
                title: Response Read Inventory Api Inventory Get
                type: array
          description: Successful Response
      security:
      - OAuth2PasswordBearer: []
      summary: Read Inventory
      tags:
      - inventory
    post:
      operationId: create_medicine_api_inventory_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Medicine'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Medicine'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Create Medicine
      tags:
      - inventory
  /api/inventory/{medicine_id}:
    delete:
      operationId: delete_medicine_api_inventory__medicine_id__delete
      parameters:
      - in: path
        name: medicine_id
        required: true
        schema:
          title: Medicine Id
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
