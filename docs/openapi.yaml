  /api/prescriptions/create:
    post:
      description: "Uploads a base64 encoded image of a prescription.\n\n    1. Saves\
        \ the image to the server.\n    2. Uses AI to extract medication names, dosages,\
        \ and doctor information.\n    3. Saves the extracted data to the database\
        \ linked to the current user."
      operationId: create_prescription_api_prescriptions_create_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrescriptionCreate'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrescriptionPublic'
          description: Prescription successfully processed and saved.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: Unauthorized - Valid token required.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: Internal Server Error - AI extraction or database save failed.
      security:
      - OAuth2PasswordBearer: []
      summary: Create and process a new prescription
      tags:
      - prescription
